[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salt-ml"
version = "0.2.0.dev0"
description = "Suggest a machine learning model and hyperparameters for your dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Roger Bermudez-Chacon" },
    { name = "Kevin Smith" },
    { name = "Peter Horvath" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "optuna>=3.4",
    "joblib>=1.3",
    # Parquet is advertised as a supported input format, so its engine is a
    # hard requirement rather than an extra.
    "pyarrow>=12.0",
    # Gradient-boosted trees. These are what usually win on tabular data, so
    # a default install that omitted them would not be the tool it claims to
    # be. Each needs a working OpenMP runtime (libgomp1 on Debian/Ubuntu).
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    # TabPFN 2.x downloads its weights freely; 8.x requires a licence token in
    # TABPFN_TOKEN. Both work, so the pin is a floor with a documented ceiling.
    # Brings torch with it, which is the single largest thing SALT installs.
    "tabpfn>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
saltml = "saltml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saltml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model weights or a long fit; deselect with -m 'not slow'",
]
