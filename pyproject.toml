[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salt-ml"
version = "0.2.0.dev0"
description = "Suggest a machine learning model and hyperparameters for your dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Roger Bermudez-Chacon" },
    { name = "Kevin Smith" },
    { name = "Peter Horvath" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "optuna>=3.4",
    "joblib>=1.3",
    # Parquet is advertised as a supported input format, so its engine is a
    # hard requirement rather than an extra.
    "pyarrow>=12.0",
]

[project.optional-dependencies]
# Gradient-boosted trees. Separate because they are the heaviest dependencies
# and each needs a working OpenMP runtime.
boost = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
salt = "salt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
